<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>输入框预览</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #f5f5f5; min-height: 100vh; }
    .dark body { background: #1a1a1a; }
  </style>
</head>
<body class="flex flex-col">
  <div class="flex-1 flex items-center justify-center p-8">
    <div class="text-center text-gray-500">
      <h1 class="text-2xl font-bold mb-2">输入框 UI 预览</h1>
      <p>下方是新设计的输入框组件</p>
    </div>
  </div>

  <!-- 新版输入框 -->
  <div class="flex-shrink-0 bg-white pl-4 pr-4 pb-4">
    <div class="w-full max-w-[960px] mx-auto">
      <input type="file" class="hidden" accept=".txt,.md,.json,.yaml,.yml,.xml,.csv,.pdf,.doc,.docx" multiple>
      <div class="relative flex flex-col rounded-xl border border-[#0000001F] transition-all bg-white/90 shadow-[0px_4px_16px_0px_#0000000D]">
        <!-- Textarea area -->
        <div class="overflow-hidden relative py-3 px-3">
          <textarea
            placeholder="输入消息"
            class="w-full text-sm bg-transparent resize-none overflow-x-hidden outline-none text-gray-900 placeholder:text-gray-400"
            style="min-height: 40px; max-height: 216px;"
            rows="2"
          ></textarea>
        </div>
        
        <!-- Bottom bar with buttons -->
        <div class="flex justify-between items-center p-3 border-t border-[#DBDBDB]/60">
          <div class="flex items-center gap-2">
            <div class="flex items-center">
              <div aria-label="上传文档" class="flex">
                <button
                  type="button"
                  class="rounded-lg bg-transparent p-2 text-gray-800 outline-hidden transition hover:bg-gray-100"
                  title="上传文档"
                >
                  <svg class="w-3 h-3" viewBox="0 0 9 9" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4.33329 0.666992V8.00033M0.666626 4.33366H7.99996" stroke="currentColor" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <div class="flex items-center">
              <div aria-label="发送" class="flex">
                <button
                  type="button"
                  class="flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-sm font-medium transition-colors bg-[#E0E0E0] text-[#110F0F]/20 cursor-not-allowed"
                >
                  <svg class="w-4 h-4" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 13.3333V2.66667M8 2.66667L4 6.66667M8 2.66667L12 6.66667" stroke="currentColor" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  <span>发送</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 对比：旧版 -->
  <div class="flex-shrink-0 bg-gray-100 pl-4 pr-4 pt-8 pb-4">
    <div class="text-center text-gray-400 text-xs mb-4">↓ 原版设计对比 ↓</div>
    <div class="w-full max-w-[960px] mx-auto">
      <div class="flex min-w-0 items-end gap-2 gap-3">
        <button
          type="button"
          title="上传文档"
          class="flex-shrink-0 rounded-lg border border-gray-300 bg-white text-gray-600 hover:bg-gray-50 hover:text-gray-900 disabled:opacity-40 disabled:cursor-not-allowed transition-colors w-12 h-[52px] rounded-xl inline-flex items-center justify-center"
          disabled=""
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
            <path d="M5 12h14"></path>
            <path d="M12 5v14"></path>
          </svg>
        </button>
        <div class="relative min-w-0 flex-1">
          <div class="border rounded-lg focus-within:border-gray-400 focus-within:ring-2 focus-within:ring-gray-100 transition-all bg-white overflow-hidden border-gray-200 bg-gray-50 border-2 rounded-xl focus-within:ring-4">
            <div class="px-3 py-3">
              <textarea placeholder="AI 正在处理中，请稍候..." class="w-full resize-none outline-none text-sm placeholder-gray-400 text-gray-400 cursor-not-allowed bg-transparent" rows="1" style="min-height: 24px; max-height: 200px; height: 24px;" disabled=""></textarea>
            </div>
          </div>
        </div>
        <button class="flex-shrink-0 bg-red-600 text-white rounded-lg hover:bg-red-700 disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-1 text-sm transition-colors px-6 py-3 h-[52px] rounded-xl shadow-md hover:shadow-lg" disabled="">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
            <path d="m22 2-7 20-4-9-9-4Z"></path>
            <path d="M22 2 11 13"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>
</body>
</html>
